[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "griot-asr-turbo"
version = "0.1.0"
description = "Fast, lightweight Ghanaian Speech Recognition (Twi, Ewe, Ga, Dagbani) using Sherpa-ONNX on Mobile and Edge"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [
    { name = "GhanaNLP", email = "info@ghananlp.org" }
]
keywords = ["asr", "speech-recognition", "twi", "akan", "sherpa-onnx", "mobile", "edge"]
dependencies = [
    "sherpa-onnx>=1.10.0",
    "soundfile>=0.12.0",
    "numpy>=1.20.0",
    "scipy>=1.10.0"
]

[project.scripts]
griot-transcribe = "cli:main"
